name: Exp 04b instruction-matched state ablation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/exp04b-instruction-matched-state-ablation.yml"

permissions:
  contents: read

jobs:
  run-exp04b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVDIA_API_KEY: ${{ secrets.NVDIA_API_KEY }}
      NVIDIA_MODEL: openai/gpt-oss-20b
      NVIDIA_TIMEOUT: "180"
      NVIDIA_MAX_RETRIES: "3"
      NVIDIA_RETRY_BACKOFF: "2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark
        run: python -m pip install -e .

      - name: Run instruction-matched state ablation
        run: python experiments/exp04b_instruction_matched_state_ablation.py

      - name: Upload probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp04b-instruction-matched-state-ablation
          path: results/exp04b_instruction_matched_state_ablation/
          if-no-files-found: warn
          retention-days: 14
