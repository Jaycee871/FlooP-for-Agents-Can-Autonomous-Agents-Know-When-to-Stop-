name: Exp 06 repeated cross-model transition replication

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/exp06-trigger-cross-model.txt"

permissions:
  contents: read

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: gpt-oss-20b
            model: openai/gpt-oss-20b
            result_dir: openai__gpt-oss-20b
            max_tokens: "6144"
          - label: deepseek-v4-flash-0731
            model: deepseek-ai/deepseek-v4-flash-0731
            result_dir: deepseek-ai__deepseek-v4-flash-0731
            max_tokens: "4096"
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVDIA_API_KEY: ${{ secrets.NVDIA_API_KEY }}
      NVIDIA_MODEL: ${{ matrix.model }}
      NVIDIA_TIMEOUT: "180"
      NVIDIA_MAX_RETRIES: "3"
      NVIDIA_RETRY_BACKOFF: "2"
      EXP06_MAX_TOKENS: ${{ matrix.max_tokens }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark
        run: python -m pip install -e .

      - name: Run repeated transition audit with scientific validity gate
        run: python experiments/exp06_repeated_transition_audit.py --repeats 3 --require-complete

      - name: Upload replication probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp06-${{ matrix.label }}
          path: results/exp06_repeated_transition_audit/${{ matrix.result_dir }}/
          if-no-files-found: warn
          retention-days: 14
