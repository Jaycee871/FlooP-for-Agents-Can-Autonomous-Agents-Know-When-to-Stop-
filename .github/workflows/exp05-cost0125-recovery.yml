name: Exp 05 cost-0.125 Bellman recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-exp05-cost0125:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVDIA_API_KEY: ${{ secrets.NVDIA_API_KEY }}
      NVIDIA_MODEL: openai/gpt-oss-20b
      NVIDIA_TIMEOUT: "180"
      NVIDIA_MAX_RETRIES: "3"
      NVIDIA_RETRY_BACKOFF: "2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark
        run: python -m pip install -e .

      - name: Recover cost-0.125 Bellman observation
        run: python experiments/exp05_recover_cost0125.py

      - name: Upload recovery probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp05-cost0125-recovery
          path: results/exp05_cost0125_recovery/
          if-no-files-found: warn
          retention-days: 14
