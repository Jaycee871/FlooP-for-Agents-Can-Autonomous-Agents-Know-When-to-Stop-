name: NVIDIA model inventory

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/nvidia-model-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVDIA_API_KEY: ${{ secrets.NVDIA_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark
        run: python -m pip install -e .
      - name: List currently advertised models
        run: python experiments/nvidia_model_inventory.py
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-model-inventory
          path: results/nvidia_model_inventory/
          if-no-files-found: warn
          retention-days: 7
