name: Exp 04 calibrated-state stopping ablation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/exp04-calibrated-state-ablation.yml"
      - "experiments/exp04_calibrated_state_ablation.py"
      - "experiments/exp03_boundary_sweep.py"
      - "src/floop_agents/search_arena.py"
      - "src/floop_agents/providers/nvidia.py"

permissions:
  contents: read

jobs:
  run-exp04:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVDIA_API_KEY: ${{ secrets.NVDIA_API_KEY }}
      NVIDIA_MODEL: openai/gpt-oss-20b

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark
        run: python -m pip install -e .

      - name: Run calibrated-state stopping ablation
        run: python experiments/exp04_calibrated_state_ablation.py

      - name: Upload probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp04-calibrated-state-ablation
          path: results/exp04_calibrated_state_ablation/
          if-no-files-found: warn
          retention-days: 14
