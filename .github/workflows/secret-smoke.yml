name: Secret connectivity smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN1: ${{ secrets.HF_TOKEN1 }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      NVDIA_API_KEY: ${{ secrets.NVDIA_API_KEY }}

    steps:
      - name: Check secret presence
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for name in HF_TOKEN1 KAGGLE_TOKEN NVDIA_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not available to this workflow"
              fail=1
            else
              echo "$name: present"
            fi
          done
          exit "$fail"

      - name: Test Hugging Face token
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/hf.json -w "%{http_code}" \
            -H "Authorization: Bearer ${HF_TOKEN1}" \
            https://huggingface.co/api/whoami-v2)
          if [ "$code" != "200" ]; then
            echo "::error::Hugging Face authentication failed (HTTP $code)"
            exit 1
          fi
          echo "Hugging Face authentication: OK"

      - name: Test NVIDIA API key
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/nvidia.json -w "%{http_code}" \
            -H "Authorization: Bearer ${NVDIA_API_KEY}" \
            -H "Accept: application/json" \
            https://integrate.api.nvidia.com/v1/models)
          if [ "$code" != "200" ]; then
            echo "::error::NVIDIA API authentication/connectivity failed (HTTP $code)"
            exit 1
          fi
          echo "NVIDIA API authentication: OK"

      - name: Test Kaggle token
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check kaggle
          if ! kaggle datasets list --page-size 1 >/tmp/kaggle.out 2>/tmp/kaggle.err; then
            echo "::error::Kaggle authentication/connectivity failed"
            sed -E 's/[A-Za-z0-9_=-]{20,}/[REDACTED]/g' /tmp/kaggle.err | head -20
            exit 1
          fi
          echo "Kaggle authentication: OK"
