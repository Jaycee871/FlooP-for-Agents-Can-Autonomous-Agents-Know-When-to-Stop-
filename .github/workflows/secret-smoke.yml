name: Secret connectivity smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/secret-smoke.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN1: ${{ secrets.HF_TOKEN1 }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVDIA_API_KEY: ${{ secrets.NVDIA_API_KEY }}

    steps:
      - name: Check secret presence
        shell: bash
        run: |
          set -u
          [ -n "${HF_TOKEN1:-}" ] && echo "HF_TOKEN1: present" || echo "::warning::HF_TOKEN1: missing"
          [ -n "${KAGGLE_TOKEN:-}" ] && echo "KAGGLE_TOKEN: present" || echo "::warning::KAGGLE_TOKEN: missing"
          if [ -n "${NVIDIA_API_KEY:-}" ]; then
            echo "NVIDIA API key: present as NVIDIA_API_KEY"
          elif [ -n "${NVDIA_API_KEY:-}" ]; then
            echo "NVIDIA API key: present as NVDIA_API_KEY"
          else
            echo "::warning::NVIDIA API key: missing under both NVIDIA_API_KEY and NVDIA_API_KEY"
          fi

      - name: Test Hugging Face token
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN1:-}" ]; then
            echo "::error::HF_TOKEN1 is missing"
            exit 1
          fi
          code=$(curl -sS -o /tmp/hf.json -w "%{http_code}" \
            -H "Authorization: Bearer ${HF_TOKEN1}" \
            https://huggingface.co/api/whoami-v2)
          if [ "$code" != "200" ]; then
            echo "::error::Hugging Face authentication failed (HTTP $code)"
            exit 1
          fi
          echo "Hugging Face authentication: OK"

      - name: Test NVIDIA API key
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          NV_KEY="${NVIDIA_API_KEY:-${NVDIA_API_KEY:-}}"
          if [ -z "$NV_KEY" ]; then
            echo "::error::NVIDIA API key is missing"
            exit 1
          fi
          code=$(curl -sS -o /tmp/nvidia.json -w "%{http_code}" \
            -H "Authorization: Bearer ${NV_KEY}" \
            -H "Accept: application/json" \
            https://integrate.api.nvidia.com/v1/models)
          if [ "$code" != "200" ]; then
            echo "::error::NVIDIA API authentication/connectivity failed (HTTP $code)"
            exit 1
          fi
          echo "NVIDIA API authentication: OK"

      - name: Test Kaggle token
        if: always()
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "::error::KAGGLE_TOKEN is missing"
            exit 1
          fi
          python -m pip install --quiet --disable-pip-version-check kaggle
          if ! kaggle datasets list --page-size 1 >/tmp/kaggle.out 2>/tmp/kaggle.err; then
            echo "::error::Kaggle authentication/connectivity failed"
            sed -E 's/[A-Za-z0-9_=-]{20,}/[REDACTED]/g' /tmp/kaggle.err | head -20
            exit 1
          fi
          echo "Kaggle authentication: OK"
